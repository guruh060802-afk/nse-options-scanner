name: Daily NSE Derivatives Scan

# GitHub's scheduler is best-effort: it queues, delays and occasionally drops
# runs. A single daily trigger at 09:00 IST is intentional - it builds the plan
# from the previous close, before the open. Verify the chain timestamp in the
# alert before acting on it.
on:
  schedule:
    - cron: '30 3 * * 1-5'          # 03:30 UTC = 09:00 IST, Mon-Fri
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print only, do not send to Telegram'
        type: boolean
        default: false

# Least privilege. The scanner only reads; it has no write access to this repo.
permissions:
  contents: read

# Never let two runs overlap and double-post.
concurrency:
  group: nse-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run scanner
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_KEY: ${{ secrets.ANGEL_TOTP_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python main.py
